# Copy to config.yaml and fill in your details. config.yaml is git-ignored because it holds your contact details.

profile:
  first_name: Your
  last_name: Name
  email: you@example.com
  phone: "(555) 555-0100"
  linkedin: https://www.linkedin.com/in/your-profile/
  github: https://github.com/your-username
  website: ""
  current_company: ""
  location: "City, State"
  postal_code: ""          # for "What's your zip / postal code?"
  current_title: ""        # current or most recent job title
  # Highest degree, for the education section some forms have.
  school: ""
  school_other_name: ""    # e.g. the university, if school is a faculty within it
  degree: ""               # e.g. Master's Degree
  degree_other_name: ""    # another wording, e.g. Master's
  discipline: ""
  graduation_year: ""
  city: ""
  resume_path: ~/Documents/resume.pdf

prefs:
  daily_limit: 30          # max applications per day
  max_per_company: 3       # spread applications across companies
  us_only: true
  remote_only: false
  prefer_remote: false
  # Jobs whose location matches one of these (regex, case-insensitive) get +15 and rank first.
  preferred_locations:
    - syracuse
    - '(?<!west )virginia'
    - ',\s*va\b'
  preferred_location_bonus: 15

  # A title must contain one of these...
  title_include:
    - data scientist
    - machine learning
    - ml engineer
    - applied scientist
    - ai engineer
    - analytics engineer
    - nlp
    - llm
  # ...and none of these (whole words).
  title_exclude:
    - intern
    - internship
    - director
    - principal
    - staff            # also covers "Senior Staff"; plain "Senior" roles are kept
    - distinguished
    - vp
    - head of
    - manager
    - phd
    - new grad
  # Extra points when the title has one of these.
  title_bonus: [senior, data scientist, machine learning, nlp, llm, genai]

  # Skills from your resume. Jobs that mention more of them rank higher.
  skills: [python, sql, pyspark, spark, pandas, databricks, etl, machine learning, nlp, llm,
           llms, rag, retrieval, generative ai, genai, predictive modeling, feature engineering,
           azure, aws, vector database, tableau, power bi, dashboards, a/b testing, statistics,
           data pipelines, airflow, dbt, langchain, transformers, pytorch, scikit-learn]

companies_file: companies.yaml
answers_file: answers.yaml   # your answers to application questions (see answers.example.yaml)
db_path: applications.db
browser_profile_dir: ~/.autoapply-browser
tabs_at_once: 5          # application forms open at the same time during `apply`
