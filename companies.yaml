# Job boards to scan every day. Add any company that hosts its careers page on
# Greenhouse, Lever or Ashby. Find the token in the careers URL:
#   job-boards.greenhouse.io/<token>   boards.greenhouse.io/<token>
#   jobs.lever.co/<token>
#   jobs.ashbyhq.com/<token>
# A board that has moved or closed just prints a warning and is skipped.
