# Your answers to the questions application forms ask. Copy to answers.yaml (git-ignored) and edit.
#
#   cp answers.example.yaml answers.yaml
#   open -e answers.yaml
#
# Every answer here is sent to employers exactly as written, so make each one true for you.
# The tool refuses to run while any CHANGE_ME is left or `confirmed` is false.

confirmed: false        # set to true after you've checked every answer below

# Rules are tried first, top to bottom. `match` is a list of regular expressions
# (case-insensitive) checked against the question text; the first rule that matches wins.
# For dropdowns and radio buttons, `answer` is matched against the option text, and a
# "decline" answer also picks options like "I don't wish to answer" or "Prefer not to say".
# `answer` can be a list: for a dropdown the first one that matches an option is used,
# for a text box the first one.
# Put Yes and No in quotes ("Yes"), otherwise YAML reads them as true/false (the tool copes either way).
# {first_name}, {current_company}, {location} etc. are filled in from the profile in config.yaml,
# and {company} and {title} from the job.
# `section` limits a rule to one part of the form (by its heading), for labels like
# "Start date month" that mean different things under Employment and Education.
# When a rule's answer isn't one of a dropdown's choices, the next matching rule is tried.
#
# After a `git pull`, new rules added to answers.example.yaml are used automatically after
# your own rules, so you don't need to copy them over.
rules:
  # --- Work authorization: decide these two yourself. ---
  # Canadians on TN can usually answer the first one "Yes" (TN is granted at the border with
  # a job offer), but some employers mean "without any visa". Pick what you're comfortable with.
  - match: ["legally authori[sz]ed to work", "(authori[sz]ed|eligible|legally able|permitted) to (legally )?work", "right to work"]
    answer: CHANGE_ME          # Yes / No
  # TN does not need H-1B sponsorship, but the employer does sign a TN support letter.
  - match: ["require.*sponsor", "need.*sponsor", "sponsorship", "immigration support", "visa status", "h-?1b"]
    answer: CHANGE_ME          # usually No for TN, or Yes if you want to be upfront

  # --- Location and logistics ---
  - match: ["willing to relocate", "open to relocat", "relocation"]
    answer: "Yes"
  - match: ["commute", "work (from|in) (the|our) office", "hybrid", "on-?site", "in[- ]person"]
    answer: "Yes"
  - match: ["^(current )?location", "^city", "where are you (currently )?(located|based)", "where do you (intend|plan) to work", "from where do you (intend|plan) to work"]
    answer: "Toronto, Ontario, Canada"
  - match: ["^(current )?location", "^city"]
    answer: ["{location}", "{city}"]
  - match: ["^country", "country (of|where) (residence|you live)"]
    answer: "Canada"
  - match: ["^start date\\W*$", "when can you start", "earliest.*start", "available to start", "notice period"]
    answer: ["Two weeks after an offer", "2 weeks", "Within 2 weeks", "Two weeks", "Within 1 month", "Within a month", "Less than 1 month", "1 month"]
  - match: ["over (the age of )?18", "at least 18", "18 years", "18\\+"]
    answer: "Yes"

  # --- About you (filled in from config.yaml) ---
  - match: ["preferred (first )?name"]
    answer: "{first_name}"
  - match: ["preferred last name"]
    answer: "{last_name}"
  - match: ["legal name", "full name"]
    answer: "{first_name} {last_name}"
  - match: ["(current|most recent) (\\(or most recent\\) )?(company|employer)"]
    answer: "{current_company}"
  - match: ["(current|most recent)( job)? title", "current/most recent (job )?title", "current (role|position)\\W*$"]
    answer: "{current_title}"
  - match: ["postal code", "zip ?code", "postcode"]
    answer: "{postal_code}"      # add postal_code: "..." under profile in config.yaml

  # --- Employment section (filled in from the profile in config.yaml) ---
  - section: "employment|experience|work history"
    match: ["^company( name)?\\W*$", "^employer"]
    answer: "{current_company}"
  - section: "employment|experience|work history"
    match: ["^(job )?title\\W*$", "^(role|position)\\W*$"]
    answer: "{current_title}"
  - section: "employment|experience|work history"
    match: ["start date month", "^start month"]
    answer: "{current_start_month}"
  - section: "employment|experience|work history"
    match: ["start date year", "^start year"]
    answer: "{current_start_year}"
  - section: "employment|experience|work history"
    match: ["current role", "currently work here", "i currently work", "current job"]
    answer: ["Current role", "I currently work here", "Currently work here", "Current job", "Yes"]

  # --- Education (filled in from the profile in config.yaml) ---
  - section: "education"
    match: ["end date month", "graduation month"]
    answer: "{graduation_month}"
  - section: "education"
    match: ["end date year"]
    answer: "{graduation_year}"
  - match: ["^(name of )?(school|university|college|institution)\\b"]
    answer: ["{school}", "{school_other_name}"]
  - match: ["^degree"]
    answer: ["{degree}", "{degree_other_name}"]
  - match: ["^discipline", "field of study", "^major\\b", "area of study"]
    answer: "{discipline}"
  - match: ["graduation year", "year of graduation", "year graduated"]
    answer: "{graduation_year}"
  - match: ["\\bph\\.?d\\b", "doctorate", "doctoral"]
    answer: "No"
  - match: ["optional practical training", "\\bopt\\b(?!-)", "\\bstem\\b.*extension", "\\bcpt\\b"]
    answer: "No"              # OPT/CPT are for F-1 students; TN doesn't use them

  # --- About this application ---
  - match: ["how did you (hear|find|learn)", "where did you (hear|find|learn)", "where have you (heard|learned|learnt|found)", "^source"]
    answer: ["Company website", "{company} website", "{company} careers", "Company careers", "Careers page", "Career site", "Careers",
             "Website", "Job board", "Online job board", "Online", "Internet", "Search engine", "Other"]
  - match: ["previously,? (been )?(employed|worked)", "worked (for|at) .* before", "former employee", "ever (been )?(employed|worked) (by|for|at)",
            "(currently|previously),? (or have you previously,? )?work(ed)? (for|at)"]
    answer: "No"
  - match: ["government official", "public office"]
    answer: "No"
  - match: ["conflict of interest", "significant financial interest"]
    answer: "No"
  - match: ["referr?ed by", "referral", "know anyone", "were you referred", "referred to this (position|role|job)"]
    answer: "No"
  - match: ["non-?compete", "non-?solicit", "agreement with a former employer"]
    answer: "No"
  - match: ["(accept|comfortable with|okay with|ok with|agree with|agreeable to) the (listed |posted |stated )?(salary|pay|compensation)"]
    answer: "Yes"
  - match: ["salary", "compensation expectation", "pay expectation", "desired pay"]
    answer: "Open to discussing; aligned with the posted range"
  - match: ["pronoun"]
    answer: "Prefer not to say"
  - match: ["willing (and able )?to travel", "travel to customer", "travel requirement"]
    answer: "Yes"
  - match: ["plan to work remotely", "prefer to work remotely"]
    answer: "Yes"
  - match: ["whatsapp", "\\bsms\\b", "text messages?", "opt[- ]?in"]
    answer: "No"              # never sign up for messages
  - match: ["(how|ways) you use ai tools", "experience (with |using )ai tools", "ai tools or technologies", "use of ai tools"]
    answer: ["Advanced", "Expert", "Daily", "Extensively", "Frequently", "Regularly"]

  # --- Free-text questions. `only_without_claude: true` means these are used only when no
  # ANTHROPIC_API_KEY is set; with a key, Claude writes a tailored answer for each job instead.
  # {company} and {title} are replaced with the job's company and title.
  - only_without_claude: true
    match: ["why (do you want|would you like|are you interested|are you applying)", "what (interests|excites|draws) you"]
    answer: >-
      I'm excited about the {title} role at {company} because it matches what I do best: building
      LLM, NLP and retrieval-augmented analytics that make business decisions faster. At Deloitte
      and Outlier AI I built production RAG and document-intelligence pipelines on Azure that cut
      review and reporting time by 30-40%, and I'd like to bring that same impact to {company}.
  - only_without_claude: true
    match: ["cover letter", "anything else", "additional information", "tell us about yourself"]
    answer: >-
      I'm a data scientist and ML engineer with experience building LLM-powered analytics, NLP and
      RAG systems in Python, SQL, Spark, Azure and AWS. I'm a Canadian citizen eligible for TN work
      status, open to relocating, and would be glad to discuss how I can help {company}.

  # --- Voluntary US EEO questions. "Decline" answers are always allowed. ---
  - match: ["gender", "sex\\b"]
    answer: "Decline to self-identify"
  - match: ["\\brace\\b", "racial", "ethnic", "hispanic", "latin[ox]"]
    answer: "Decline to self-identify"
  - match: ["veteran"]
    answer: "I don't wish to answer"
  - match: ["disability"]
    answer: "I don't want to answer"
  - match: ["sexual orientation", "transgender", "lgbt"]
    answer: "Decline to self-identify"

# Facts Claude may use for questions the rules above don't cover (free-text questions
# like "Why do you want to work here?", and unusual dropdowns). Claude also reads your
# resume. It is told to skip a question rather than guess when these don't settle it.
facts:
  citizenship: Canadian citizen, eligible for TN work status in the United States
  current_location: Toronto, Ontario, Canada
  relocation: Willing to relocate anywhere in the US; prefers Syracuse, NY or Virginia
  work_style: Open to remote, hybrid or on-site
  notice_period: Two weeks
  highest_degree: Master of Management in Artificial Intelligence, Schulich School of Business (2024)

use_claude: true              # needs ANTHROPIC_API_KEY set in your environment
claude_model: claude-haiku-5-5   # cheapest: about 3 cents a day for 30 applications
claude_effort: low                # low keeps answers short and cheap
